<p-table #table [value]="devices()" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]" >
  <ng-template #caption>
    <div class="flex justify-between">
      <p-button outlined [label]="`${devices().length} Devices`" />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name" class="w-[27.5%]">Name <p-sortIcon field="name"></p-sortIcon></th>
      <th pSortableColumn="code" class="w-[22.5%]">Type <p-sortIcon field="type"></p-sortIcon></th>
      <th pSortableColumn="connected" class="w-[22.5%]">Connection <p-sortIcon field="connected"></p-sortIcon></th>
      <th pSortableColumn="lastSeen" class="w-[22.5%]">Last Seen<p-sortIcon field="lastSeen"></p-sortIcon></th>
      <th class="w-[5%]">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.type }}</td>
      <td>
        @if (item.connected) {
          <p-tag severity="success">Connected</p-tag>
        } @else {
          <p-tag severity="danger">Disconnected</p-tag>
        }
      </td>
      <td>{{ dateFormatter.toString(item.lastSeen) }}</td>
      <td>
        <div class="flex flex-row gap-2">
          <p-button icon="fa-solid fa-eye" (onClick)="track(item)"/>
          @if (item.connected){
            <p-button icon="fa-solid fa-toggle-on" (onClick)="switchOff(item)"/>
          } @else {
            <p-button icon="fa-solid fa-toggle-off" (onClick)="switchOn(item)"/>
          }
          <p-button icon="fa-solid fa-pencil" (onClick)="update(item)"/>
          <p-button icon="fa-solid fa-trash-can" severity="danger" (onClick)="delete(item)"/>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    @if (loadingDevices()){
      <tr>
        <td><p-skeleton/></td>
        <td><p-skeleton/></td>
        <td>
          <div class="flex flex-row justify-end gap-2">
            <p-button icon="fa-solid fa-eye" disabled/>
            <p-button icon="fa-solid fa-pencil" disabled/>
            <p-button icon="fa-solid fa-trash-can" severity="danger" disabled/>
          </div>
        </td>
      </tr>
    } @else {
      <tr>
        <td colspan="5">
          <div class="flex flex-col justify-center items-center h-64">
            <p class="font-bold text-2xl">No devices found.</p>
          </div>
        </td>
      </tr>
    }
  </ng-template>
</p-table>

<common-modal-update-device (onSubmit)="updateSubmit($event)" [rooms]="rooms()" [loadingRooms]="loadingRooms()" [devices]="devices()" [loadingDevices]="loadingDevices()"/>
<common-modal-delete-device (onSubmit)="deleteSubmit($event)"/>

<p-card [style]="{ width: '100%', height: '100%' }">
  <div class="flex flex-col w-full gap-4">
    <p-button label="New Conversation" (onClick)="addConversation()" outlined [style]="{ width: '100%' }"/>
    @for (conversation of conversations(); track conversation.id){
      <p-button-group [style]="{ width: '100%' }">
        <p-button [label]="conversation.name" [pTooltip]="`${conversation.name} -- ${conversation.timestamp}`" (onClick)="selectConversation(conversation)" />
        <p-button icon="fa-solid fa-trash-can" (onClick)="deleteConversation(conversation)" />
      </p-button-group>
    }
  </div>
</p-card>

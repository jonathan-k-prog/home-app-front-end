<p-card [style]="{ width: '100%', height: '100%', padding:'16px' }">
  <div class="flex flex-col h-full">
    @if (selectedConversation()){
      <div class="flex flex-col gap-2 flex-1 overflow-auto border p-4">
        @for(message of messages(); track message.id){
          <p-card [style]="{ background: message.response ? '#f0f4ff' : '#e8f5e9', padding:'8px'}">
            @if (message.response) {
              <p>Chat-Bot</p>
            } @else {
              <p>Me</p>
            }
            <p>{{message.text}}</p>
          </p-card>
        }
      </div>
    } @else {
      <div class="flex flex-col flex-1 border justify-center items-center">
        <p class="text-2xl font-bold">Start new conversation</p>
      </div>
    }

    <form [formGroup]="form" class="flex flex-row w-full gap-4 mt-4 shrink-0">
      <input pInputText type="text" id="text" placeholder="Text" formControlName="text" class="w-[95%]" />
      <button pButton (click)="send()" [disabled]="form.invalid" [ngStyle]="{'width': '5%'}">
        <span pButtonLabel>Send</span>
      </button>
    </form>

  </div>
</p-card>

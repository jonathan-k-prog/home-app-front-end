<p-dialog header="Delete Device" [modal]="true" [(visible)]="visible" (onHide)="cancel()" [style]="{ width: '35rem' }">
  <div class="flex flex-col gap-4 mb-6">
    <p class="m-0">
      Are you sure you want to delete
      <span class="font-semibold">{{ device?.name }}</span>
      ?
    </p>
    <p class="m-0 text-sm text-color-secondary">
      This action cannot be undone.
    </p>
  </div>
  <div class="flex justify-between gap-2">
    <p-button icon="pi pi-ban" label="Cancel" severity="secondary" (onClick)="cancel()" />
    <p-button icon="pi pi-trash" label="Delete" severity="danger" [disabled]="!device" (onClick)="confirm()" />
  </div>
</p-dialog>

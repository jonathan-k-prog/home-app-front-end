<p-dialog header="Select Home" [modal]="true" [(visible)]="visible" (onHide)="cancel()" [style]="{ width: '50rem' }">
  <p-table #table [value]="homes()" scrollHeight="400px" >
    <ng-template #caption>
      <div class="flex justify-between">
        <p-button outlined [label]="`${homes().length} Rooms`" />
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name" class="w-[50%]">Name <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="timestamp" class="w-[45%]">Creation Date <p-sortIcon field="timestamp"></p-sortIcon></th>
        <th class="w-[5%]">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.code }}</td>
        <td>
          <div class="flex flex-row gap-2">
            <p-button icon="pi pi-arrow-right" (onClick)="select(item)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      @if (loadingHomes()){
        <tr>
          <td><p-skeleton/></td>
          <td><p-skeleton/></td>
          <td>
            <div class="flex flex-row justify-end gap-2">
              <p-button icon="pi pi-arrow-right" disabled />
            </div>
          </td>
        </tr>
      } @else {
        <tr>
          <td colspan="3">
            <div class="flex flex-col justify-center items-center h-64">
              <p class="font-bold text-2xl">No Homes found.</p>
            </div>
          </td>
        </tr>
      }

    </ng-template>
  </p-table>

  <div class="flex justify-between gap-2 mt-2">
    <p-button icon="pi pi-ban" label="Cancel" severity="secondary" (onClick)="cancel()" />
  </div>
</p-dialog>

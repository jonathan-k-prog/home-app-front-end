<p-dialog header="Select Device" [modal]="true" [(visible)]="visible" (onHide)="cancel()" [style]="{ width: '50rem' }">
  <p-table #table [value]="devices" scrollHeight="400px" >
    <ng-template #caption>
      <div class="flex justify-between">
        <p-button outlined [label]="`${devices.length} Devices`" />
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="vehicleModel.name" class="w-[30%]">Name <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="code" class="w-[30%]">Code <p-sortIcon field="code"></p-sortIcon></th>
        <th class="w-[10%]">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.code }}</td>
        <td>
          <div class="flex flex-row gap-2">
            <p-button icon="pi pi-arrow-right" (onClick)="select(item)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      @if (loadingDevices){
        <tr>
          <td><p-skeleton/></td>
          <td><p-skeleton/></td>
          <td><p-skeleton/></td>
          <td>
            <div class="flex flex-row justify-end gap-2">
              <p-button icon="pi pi-arrow-right" disabled />
            </div>
          </td>
        </tr>
      } @else {
        <tr>
          <td colspan="4">
            <div class="flex flex-col justify-center items-center h-64">
              <p class="font-bold text-2xl">No devices found.</p>
            </div>
          </td>
        </tr>
      }

    </ng-template>
  </p-table>

  <div class="flex justify-between gap-2 mt-2">
    <p-button icon="pi pi-ban" label="Cancel" severity="secondary" (onClick)="cancel()" />

  </div>
</p-dialog>

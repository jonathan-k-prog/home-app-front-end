<p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '25rem', height: '20rem' }" [closable]="false" [draggable]="false" [closeOnEscape]="false" >

    <p-progress-spinner ariaLabel="loading" />
    <h1 class="text-4xl font-bold mt-2">Loading</h1>
  </div>
</p-dialog>

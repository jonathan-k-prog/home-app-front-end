<p-dialog header="Update Room" [modal]="true" [(visible)]="visible" (onHide)="cancel()" [style]="{ width: '50rem' }">
  <form [formGroup]="form" class="flex flex-col gap-4 mb-4 w-full">
    <div class="flex flex-col gap-4">
      <label for="name" class="font-semibold w-24">Name</label>
      <input pInputText type="text" id="name" placeholder="Name" formControlName="name" [invalid]="isInvalid('name')" />
      @if (isInvalid('name')) {
        <p-message severity="error" size="small" variant="simple">Name is required.</p-message>
      }
    </div>
    <div class="flex flex-col gap-4">
      <label for="type" class="font-semibold w-24">Type</label>
      <p-select id="type" [options]="roomTypeOptions" optionLabel="label" optionValue="value" formControlName="type" appendTo="body" placeholder="Select a type" />
      @if (isInvalid('type')) {
        <p-message severity="error" size="small" variant="simple">Type is required.</p-message>
      }
    </div>
  </form>
  <div class="flex justify-between gap-2">
    <p-button icon="pi pi-ban" label="Cancel" severity="secondary" (onClick)="cancel()" />
    <p-button icon="pi pi-check" iconPos="right" label="Save" [disabled]="form.invalid" (onClick)="save()" />
  </div>
</p-dialog>

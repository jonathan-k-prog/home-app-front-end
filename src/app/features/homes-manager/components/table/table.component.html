<p-table #table [value]="homes()" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]" >
  <ng-template #caption>
    <div class="flex justify-between">
      <p-button outlined [label]="`${homes().length} Homes`" />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name" class="w-[35%]">Name <p-sortIcon field="name"></p-sortIcon></th>
      <th pSortableColumn="identifier" class="w-[30%]">Identifier <p-sortIcon field="identifier"></p-sortIcon></th>
      <th pSortableColumn="timestamp" class="w-[30%]">Creation Date <p-sortIcon field="timestamp"></p-sortIcon></th>
      <th class="w-[5%]">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.identifier }}</td>
      <td>{{ dateFormatter.toString(item.timestamp) }}</td>
      <td>
        <div class="flex flex-row gap-2">
          <p-button icon="fa-solid fa-pencil" (onClick)="update(item)"/>
          <p-button icon="fa-solid fa-trash-can" severity="danger" (onClick)="delete(item)"/>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    @if (loadingHomes()){
      <tr>
        <td><p-skeleton/></td>
        <td><p-skeleton/></td>
        <td><p-skeleton/></td>
        <td>
          <div class="flex flex-row justify-end gap-2">
            <p-button icon="fa-solid fa-pencil" disabled/>
            <p-button icon="fa-solid fa-trash-can" severity="danger" disabled/>
          </div>
        </td>
      </tr>
    } @else {
      <tr>
        <td colspan="3">
          <div class="flex flex-col justify-center items-center h-64">
            <p class="font-bold text-2xl">No homes found.</p>
          </div>
        </td>
      </tr>
    }
  </ng-template>
</p-table>

<common-modal-update-home (onSubmit)="updateSubmit($event)" [homes]="homes()" [loadingHomes]="loadingHomes()"/>
<common-modal-delete-home (onSubmit)="deleteSubmit($event)"/>

<p-table #table [value]="rooms" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]" >
  <ng-template #caption>
    <div class="flex justify-between">
      <p-button outlined [label]="`${rooms.length} Rooms`" />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name" class="w-[50%]">Name <p-sortIcon field="name"></p-sortIcon></th>
      <th pSortableColumn="code" class="w-[45%]">Type <p-sortIcon field="type"></p-sortIcon></th>
      <th class="w-[5%]">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.type }}</td>
      <td>
        <div class="flex flex-row gap-2">
          <p-button icon="fa-solid fa-eye"/>
          <p-button icon="fa-solid fa-pencil" (onClick)="update(item)"/>
          <p-button icon="fa-solid fa-trash-can" severity="danger" (onClick)="delete(item)"/>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    @if (loading){
      <tr>
        <td><p-skeleton/></td>
        <td><p-skeleton/></td>
        <td>
          <div class="flex flex-row justify-end gap-2">
            <p-button icon="fa-solid fa-eye" disabled/>
            <p-button icon="fa-solid fa-pencil" disabled/>
            <p-button icon="fa-solid fa-trash-can" severity="danger" disabled/>
          </div>
        </td>
      </tr>
    } @else {
      <tr>
        <td colspan="3">
          <div class="flex flex-col justify-center items-center h-64">
            <p class="font-bold text-2xl">No rooms found.</p>
          </div>
        </td>
      </tr>
    }
  </ng-template>
</p-table>

<common-modal-update-room (onSubmit)="updateSubmit($event)"/>
<common-modal-delete-room (onSubmit)="deleteSubmit($event)"/>
